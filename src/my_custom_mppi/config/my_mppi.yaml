controller_server:
  ros__parameters:
    MyCustomMPPI:
      plugin: "my_custom_mppi::Controller"
      dt: 0.05
      samples: 5000
      horizon: 20
      near_goal_distance: 1.0
      near_goal_horizon: 5
      near_goal_motion_limit_percent: 50.0  # Percentage of maximum linear and angular speeds retained in each direction
      seed: 7
      reference_lookahead: 1.0
      v_min: 0.0
      v_max: 0.8
      v_std: 0.4
      a_max: 0.5
      a_min: -1.0
      w_min: -2.0
      w_max: 2.0
      w_std: 1.0
      alpha_max: 2.0
      alpha_min: -2.0
      temperature: 1.0
      rejoin_distance_percent: 60.0
      show_rollouts: true
      critics:
        collision: {enabled: true, weight: 5000.0}
        obstacle: {enabled: true, weight: 1.0}
        obstacle_speed: {enabled: true, weight: 1.0}
        obstacle_repulsion: {enabled: true, weight: 5.5}
        tracking: {enabled: true, weight: 16.0}
        follow_path_lateral: {enabled: true, weight: 10.0}
        follow_path_angle: {enabled: true, weight: 1.2}
        turn: {enabled: true, weight: 0.08}
        acceleration: {enabled: true, weight: 0.15}
        angular_acceleration: {enabled: true, weight: 0.05}
        velocity: {enabled: true, weight: 10.0}
        costmap_speed: {enabled: true, weight: 2.0}
        recovery: {enabled: true, weight: 10.0}
        terminal: {enabled: true, weight: 20.0}
